name: Audit and publish IRR research

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate e-Stat contract structure
        run: python -m src.estat_contract --allow-quarantined
      - name: Run verified analysis or publish quarantine notice
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          set -euo pipefail
          mkdir -p reports
          if python -m src.estat_contract
          then
            python src/fetch_and_compute_irr.py
          else
            cat > reports/irr_analysis_report.html <<'EOF'
          <!doctype html>
          <html lang="ja">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRR分析は隔離中</title></head>
          <body style="font-family:system-ui;max-width:760px;margin:4rem auto;padding:1rem;line-height:1.7">
          <h1>IRR分析は隔離中です</h1>
          <p>企業規模・産業・男女・年齢・賃金指標・単位・頻度・残存次元を一意に固定したe-Stat証拠契約が未完成です。</p>
          <p>未検証の統計表IDやカテゴリコードは設定から削除しました。公式e-Stat URL、取得日、メタデータSHA-256、全フィルタと期待次元がそろい、厳格検証を通過するまで分析を実行しません。</p>
          <p>合成データへの自動フォールバック、月次IRRの年率誤認、重複コホートへの通常の独立標本検定も禁止されています。</p>
          </body></html>
          EOF
          fi
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports
      - uses: actions/upload-artifact@v4
        with:
          name: irr-audit-results
          path: |
            data/processed/
            reports/
          if-no-files-found: warn

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
