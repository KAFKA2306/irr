name: Audit and publish IRR research

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run verified analysis or publish quarantine notice
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          set -euo pipefail
          mkdir -p reports
          if python - <<'PY'
          import pathlib, sys, yaml
          config = yaml.safe_load(pathlib.Path('config/estat_queries.yaml').read_text(encoding='utf-8'))
          sys.exit(0 if config.get('verified') is True else 1)
          PY
          then
            python src/fetch_and_compute_irr.py
          else
            cat > reports/irr_analysis_report.html <<'EOF'
          <!doctype html>
          <html lang="ja">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRR分析は隔離中</title></head>
          <body style="font-family:system-ui;max-width:760px;margin:4rem auto;padding:1rem;line-height:1.7">
          <h1>IRR分析は隔離中です</h1>
          <p>過去の処理は、e-Stat取得失敗時に合成賃金・合成株価へ自動的に切り替え、その結果へ統計検定を適用していました。</p>
          <p>現在は、企業規模・産業・単位・集計次元をe-Statメタ情報と照合し、<code>config/estat_queries.yaml</code>を検証済みにするまで分析を実行しません。</p>
          <p>月次IRRと年率IRRの区別、固定比較期間、出典ハッシュ、合成データ禁止、重複コホートへの推論統計禁止はコードと回帰テストへ反映済みです。</p>
          </body></html>
          EOF
          fi
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports
      - uses: actions/upload-artifact@v4
        with:
          name: irr-audit-results
          path: |
            data/processed/
            reports/
          if-no-files-found: warn

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
