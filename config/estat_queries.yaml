schema_version: 1
verified: false
quarantine_reason: >-
  旧設定に記載されていた統計表ID・産業コードは、企業規模1000人以上、
  男女計、年齢計、一般労働者、月額賃金、年間賞与、単位、年次頻度を
  同時に一意化するe-Statメタ情報と照合されていない。推測値をAPIへ
  送らないため、検証済み契約が作成されるまでqueriesは空にする。
required_scope:
  survey: 賃金構造基本統計調査
  worker_type: 一般労働者
  company_size: 1000人以上
  sex: 男女計
  age: 年齢計
  industries:
    - 産業計
    - J 金融業，保険業
    - C 鉱業，採石業，砂利採取業
    - G 情報通信業
    - E 製造業
  measures:
    wage: きまって支給する現金給与額または明示した月額賃金指標
    bonus: 年間賞与その他特別給与額
  frequency: annual
queries: []
